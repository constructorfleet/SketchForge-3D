name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request supersedes the run for the older one, so that
# run is cancelled. Runs on main are not: each is the record for its commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that changes only documentation skips every job below; they
  # report success to their required checks because they are skipped by `if:`,
  # not by a path filter on the trigger, which would leave them pending.
  # Docs-only means every changed file is Markdown or a docs/ image outside the
  # code trees, or the docs site theme, and is not read by a code job's tests:
  # README.md, docs/REST_API.md and the generated references are, so they count
  # as code. The rule lives in scripts/ci/classify-changes.mjs, and
  # tests/docs/ci-docs-only-skip.test.mjs fails when a code job's tests start
  # reading a file it calls docs-only. Pushes to main always run everything,
  # and so does any failure to classify. docs.yml runs on every pull request.
  changes:
    uses: ./.github/workflows/classify-changes.yml

  package-examples:
    name: Package examples against local API
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKETCHFORGE_API_TOKEN: docs-example-token
      SKETCHFORGE_PROJECTS_DIR: /tmp/sketchforge-doc-example-projects
      SKETCHFORGE_URL: http://127.0.0.1:3100
      PORT: 3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build public engine package
        run: npm run engine:build

      - name: Start local server
        run: |
          mkdir -p "$SKETCHFORGE_PROJECTS_DIR"
          npx next dev apps/web -p "$PORT" > "$RUNNER_TEMP/sketchforge-doc-example-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sketchforge-doc-example-server.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent -H "Authorization: Bearer $SKETCHFORGE_API_TOKEN" "$SKETCHFORGE_URL/api/v1/projects" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/sketchforge-doc-example-server.log"
          exit 1

      - name: Run TypeScript package examples
        run: npm run test:integration

      - name: Run Python package examples
        run: npm run client:test:py:integration

      - name: Stop local server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sketchforge-doc-example-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/sketchforge-doc-example-server.pid")" || true
          fi

  checks:
    name: Typecheck and unit tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Unit tests
        run: npm test

  windows-unit:
    # Release 1.20.0 shipped with no desktop installers: the desktop release
    # then ran `npm test` on each platform, one Windows-only unit failure stopped
    # the Windows build, and the attach job needed every leg. Every other job
    # here runs on ubuntu, so nothing could catch that before the release.
    # Typecheck is not repeated -- it is platform independent.
    name: Unit tests on Windows
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  api-e2e:
    # Starts a real server and asks it real questions over HTTP. The unit tests
    # call the route handlers directly, which has twice missed a route that
    # worked in-process and threw `createRequire is not a function` once Next
    # had bundled it. Compiling on demand makes this minutes rather than
    # seconds, so it is deliberately not one of the required checks: it is
    # signal, not a gate.
    name: REST API end to end
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: REST API end to end
        run: npm run test:e2e

  static-export:
    # The Cloudflare deploy workflow builds this, and nothing else checked it:
    # the export build was broken for months behind a script that silently did
    # not set STATIC_EXPORT outside Windows.
    name: Static export build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `output: "export"` still compiles in apps/web/.next and only writes the
      # exported site to .next-export, so the incremental cache is in .next/cache.
      - name: Restore the Next.js static export build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-export-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**', '!apps/web/.next*/**', 'packages/sketchforge-engine/src/**') }}
          restore-keys: |
            next-export-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-export-${{ runner.os }}-

      - name: Build static export
        run: npm run export
