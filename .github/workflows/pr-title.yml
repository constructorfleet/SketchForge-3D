name: Pull request title

# The title is the commit subject when a pull request is squash-merged, and
# release-please reads commit subjects to decide the next version. A title it
# cannot parse fails nothing and releases nothing: the change just does not
# count. This is the only place that mistake is visible before it matters.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact PR commit to verify after generated docs are committed
        required: true
        type: string
      pr_title:
        description: Current title of the pull request
        required: true
        type: string
      pr_number:
        description: Pull request number whose title is being checked
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Conventional commit
    runs-on: ubuntu-latest
    steps:
      - name: Check dispatched commit SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_TITLE: ${{ inputs.pr_title }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "workflow_dispatch selected $GITHUB_SHA, expected $EXPECTED_SHA" >&2
            exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then echo "Invalid PR number" >&2; exit 1; fi
          pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          test "$(jq -r '.state' <<< "$pr")" = open
          test "$(jq -r '.head.sha' <<< "$pr")" = "$EXPECTED_SHA"
          test "$(jq -r '.head.repo.full_name' <<< "$pr")" = "$REPOSITORY"
          test "$(jq -r '.base.repo.full_name' <<< "$pr")" = "$REPOSITORY"
          test "$(jq -r '.base.ref' <<< "$pr")" = "$default_branch"
          test "$(jq -r '.title' <<< "$pr")" = "$EXPECTED_TITLE"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Check the title
        env:
          PR_TITLE: ${{ inputs.pr_title || github.event.pull_request.title }}
        run: node scripts/check-conventional-title.mjs

      # Only a warning: these subjects reach main solely if the pull request is
      # merged with a merge commit rather than squashed, and the right fix is
      # usually to squash rather than to rewrite history.
      - name: Note any commits that would not count
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --json commits --jq '.commits[].messageHeadline' > /tmp/subjects
          strays=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if ! node scripts/check-conventional-title.mjs "$subject" >/dev/null 2>&1; then
              echo "::warning title=Commit subject::$subject"
              strays=$((strays + 1))
            fi
          done < /tmp/subjects
          if [ "$strays" -gt 0 ]; then
            echo "$strays commit subject(s) are not conventional. They only reach main if this is merged with a merge commit; squash-merging uses the title instead."
          else
            echo "Every commit subject is conventional too."
          fi
