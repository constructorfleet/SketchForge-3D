name: Client Release (npm)
run-name: npm ${{ inputs.version || github.ref_name }}

# The app's own releases use "v*.*.*"; the client libraries version
# independently of it, so they have their own tag prefixes.
on:
  push:
    tags:
      - "client-js-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match packages/sketchforge-client/package.json)"
        required: true
        type: string

permissions:
  contents: read
  # npm provenance is signed with the workflow's OIDC identity.
  id-token: write

concurrency:
  group: client-npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish @constructorfleet/sketchforge3d
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # package.json is the version of record: it is what gets published and
      # what a reader sees. The tag only points at it, so a disagreement is a
      # mistake in the tag and the release stops here rather than shipping a
      # version nobody asked for.
      - name: Check the tag matches the manifest
        run: |
          manifest=$(node -p "require('./packages/sketchforge-client/package.json').version")
          requested="${{ inputs.version || github.ref_name }}"
          requested="${requested#client-js-v}"
          if [ "$manifest" != "$requested" ]; then
            echo "::error::packages/sketchforge-client/package.json is $manifest but the release asked for $requested."
            exit 1
          fi
          echo "Publishing $manifest"

      - name: Typecheck
        run: npm run client:typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run client:build

      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/sketchforge-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
