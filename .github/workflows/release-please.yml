name: Release Please

# Versioning is driven from main, not from a tag typed by hand. Every merge
# updates a standing release pull request that carries the next version number
# and the release notes for it; merging that pull request is the release.
#
# This workflow then starts the publishing runs itself, because the tag it
# creates is made with GITHUB_TOKEN and GitHub does not start a workflow run
# for a push it made on a workflow's behalf. Both are dispatched rather than
# called: see the comment on the artifacts job.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Read the released version
        id: version
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release-please made the tag $TAG, which is not v<version>. Check include-component-in-tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  artifacts:
    name: Publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Dispatched rather than called with `uses:`. PyPI's trusted publishing
      # reads the OIDC claim for the *top-level* workflow, so a called
      # release.yml arrives at PyPI as release-please.yml and is rejected --
      # "Could not verify ... does not match expected Trusted Publisher
      # (release.yml @ ...)". PyPI does not support reusable workflows at all:
      # https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
      # A dispatched run is its own top-level run, so the claim says
      # release.yml and matches what is registered on PyPI.
      - name: Dispatch the release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: gh workflow run release.yml -f version="$VERSION"

  desktop:
    name: Desktop installers
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Dispatched rather than left to its own tag trigger, for the same reason:
      # the tag release-please pushed will not start it. A dispatch does start a
      # run, even from GITHUB_TOKEN, and desktop-release.yml already accepts a
      # version that way.
      - name: Dispatch the desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: gh workflow run desktop-release.yml -f version="$VERSION"
