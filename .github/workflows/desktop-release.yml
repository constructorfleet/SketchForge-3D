name: Desktop Release
run-name: Desktop Release ${{ inputs.version || github.ref_name }}

# No tag trigger. release-please.yml dispatches this run, and since
# release-please holds a GitHub App identity its tag push starts workflows
# too -- a tag trigger here would build and upload every release twice.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.0.6)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            artifact: desktop-windows
          - platform: linux
            runner: ubuntu-latest
            artifact: desktop-linux
          - platform: macos
            runner: macos-15-intel
            artifact: desktop-macos-x64
            arch: x64
          - platform: macos
            runner: macos-14
            artifact: desktop-macos-arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${TAG_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A dispatched run checks out the default branch, so re-running an old
      # version would build whatever main says now and label it with that
      # version. Prefer the released tag when it is there, and fall back to the
      # checked-out commit when it is not -- which is the dispatch-before-tag
      # case the "Ensure release tag exists" step below exists for.
      - name: Check out the released tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git checkout --detach "refs/tags/$TAG"
            echo "Building $TAG ($(git rev-parse --short HEAD))."
          else
            echo "No $TAG tag yet; building $(git rev-parse --short HEAD)."
          fi

      - name: Set package version
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No unit suite here. CI ran it on Linux and Windows before this commit
      # reached main, and re-running it per platform only added timeouts on
      # the slowest runners: v1.18.0 through v1.23.0 each lost a leg to one,
      # and with it every installer. The platform-specific check is the
      # package build itself, which each build action verifies file by file.

      - uses: ./.github/actions/build-mac
        if: matrix.platform == 'macos'
        with:
          version: ${{ steps.package.outputs.version }}
          artifact-name: ${{ matrix.artifact }}
          arch: ${{ matrix.arch }}
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-api-key: ${{ secrets.APPLE_API_KEY }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      - uses: ./.github/actions/build-linux
        if: matrix.platform == 'linux'
        with:
          version: ${{ steps.package.outputs.version }}
          artifact-name: ${{ matrix.artifact }}

      - uses: ./.github/actions/build-win32
        if: matrix.platform == 'windows'
        with:
          version: ${{ steps.package.outputs.version }}
          artifact-name: ${{ matrix.artifact }}

  attach:
    name: Attach packages to release
    needs: build
    # Runs after a failed leg too. It used to need every leg, so one timeout on
    # one runner left v1.18.0 through v1.23.0 published with no installers for
    # any platform. A leg uploads its artifact only after verifying its files,
    # so the artifacts that exist are the legs that built: attach those, mark
    # the release page with what is missing, and fail the run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # The workflow's own commit, not the released tag: the staging script
      # below must come from here, and an older tag may predate it.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release metadata
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            tag="v$version"
          else
            tag="$TAG_NAME"
            version="${tag#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Normalize package version
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only to give a dispatched run something to attach to when no tag exists.
      # The build legs found no tag either, so they built this same commit.
      - name: Ensure release tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already on the remote, at $(git rev-list -n 1 "$TAG")."
          else
            sha=$(git rev-parse HEAD)
            git tag "$TAG" "$sha"
            git push origin "$TAG"
            echo "Created $TAG at $sha."
          fi

      # Mirrors build-mac: without every signing secret the macOS legs build
      # -unsigned packages and publish no updater manifest.
      - name: Resolve macOS signing state
        id: signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          signed=true
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" || -z "$APPLE_API_KEY" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
            signed=false
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      # By pattern, so a leg that failed is simply absent rather than failing
      # the download. Each artifact lands in dist/artifacts/<artifact name>/.
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/artifacts

      - name: Install staging dependencies
        run: npm ci --ignore-scripts

      - name: Stage desktop packages
        id: stage
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          node scripts/release/desktop-release-assets.mjs stage \
            --artifacts dist/artifacts --out dist/release \
            --version "$VERSION" --signed "$SIGNED"
          ls -l dist/release

      # This workflow no longer owns the release: release-please creates it when
      # the release pull request merges, and creates it *published*, because
      # GitHub does not make the git tag for a draft. So finding a published
      # release here is the normal case, not a conflict -- this step used to
      # refuse it, which meant every build succeeded and no installer was ever
      # attached. It only creates one when nothing is there, which is the
      # workflow_dispatch path for a tag that has no release.
      - name: Ensure the release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(gh release view "$TAG" --json isDraft 2>/dev/null || true)
          if [ -n "$existing" ]; then
            is_draft=$(jq -r '.isDraft' <<< "$existing")
            echo "Attaching to the existing release $TAG (draft=$is_draft)."
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "SketchForge $VERSION" \
              --notes "SketchForge desktop $VERSION"
            is_draft=true
          fi
          echo "was_draft=$is_draft" >> "$GITHUB_OUTPUT"

      # Replaces only the platforms this run rebuilt. Assets of a leg that
      # failed this time stay as they were, so re-running a release to fill in
      # one platform cannot take the others away.
      - name: Upload desktop packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          COMPLETE: ${{ steps.stage.outputs.complete }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
          node scripts/release/desktop-release-assets.mjs stale \
            --assets "$RUNNER_TEMP/release-assets.txt" --staged dist/release --complete "$COMPLETE" \
            > "$RUNNER_TEMP/stale-assets.txt"
          while IFS= read -r asset; do
            echo "Removing $asset, which this run rebuilt under another name."
            gh release delete-asset "$TAG" "$asset" --yes
          done < "$RUNNER_TEMP/stale-assets.txt"

          shopt -s nullglob
          files=(dist/release/*)
          if (( ${#files[@]} == 0 )); then
            echo "::warning::No desktop leg built, so nothing is attached."
          else
            gh release upload "$TAG" "${files[@]}" --clobber
          fi

      - name: Check release assets
        id: check
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
          node scripts/release/desktop-release-assets.mjs check \
            --assets "$RUNNER_TEMP/release-assets.txt" --version "$VERSION" --signed "$SIGNED"

      # A release-please release is public before any installer exists, so an
      # incomplete one says so at the top of its notes. A complete re-run
      # removes the notice; the generated notes below it are left untouched.
      - name: Mark the release page
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MISSING: ${{ steps.check.outputs.missing }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release view "$TAG" --json body --jq '.body' > "$RUNNER_TEMP/release-notes.md"
          node scripts/release/desktop-release-assets.mjs notes \
            --body "$RUNNER_TEMP/release-notes.md" --missing "$MISSING" --run-url "$RUN_URL" \
            > "$RUNNER_TEMP/release-notes-new.md"
          if cmp -s "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-notes-new.md"; then
            echo "Release notes unchanged."
          else
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes-new.md"
          fi

      # Only a draft this workflow created itself is published, and only once
      # complete. A release-please release is already published, and marking an
      # older release latest when it is re-run would take that from a newer one.
      - name: Publish release as latest
        if: ${{ steps.release.outputs.was_draft == 'true' && steps.check.outputs.missing == '' && steps.check.outputs.unexpected == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

      - name: Fail when an installer is missing
        if: ${{ steps.check.outputs.missing != '' || steps.check.outputs.unexpected != '' }}
        env:
          MISSING: ${{ steps.check.outputs.missing }}
          UNEXPECTED: ${{ steps.check.outputs.unexpected }}
        run: |
          echo "::error::Desktop release is incomplete. Missing: ${MISSING:-none}. Unexpected: ${UNEXPECTED:-none}. Re-run this workflow for the version once the failed leg is fixed."
          exit 1
