name: Classify changes

# Called by ci.yml and docker.yml. Outputs code=false only for a pull request
# whose every changed file is documentation no code job reads; the rule and
# the list of documentation that does count as code are in
# scripts/ci/classify-changes.mjs. Callers gate their code jobs with
#   if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
# so a skipped job reports success to its required check, and a missing output
# (this job failed) runs everything rather than skipping it. Path filters on
# the workflow trigger are not used: they leave required checks pending.
on:
  workflow_call:
    outputs:
      code:
        description: "'true' when the code jobs must run, 'false' for documentation only"
        value: ${{ jobs.classify.outputs.code }}

permissions:
  contents: read

jobs:
  classify:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull_request checkout is the merge commit; the classifier
          # diffs it against its first parent, the base.
          fetch-depth: 2

      - name: Classify changed files
        id: classify
        run: node scripts/ci/classify-changes.mjs || echo "code=true" >> "$GITHUB_OUTPUT"
