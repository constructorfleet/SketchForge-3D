name: Documentation site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes the run for the older one, so that
# run is cancelled; the generated-docs commit skips a cancelled run. Runs on
# main are not: each one deploys Pages and feeds the generated-docs repair.
concurrency:
  group: docs-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python for CLI help reference
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/sketchforge-py/requirements-dev.txt
      - name: Install dependencies
        run: npm ci
      - name: Install Python documentation checks
        run: python -m pip install -r packages/sketchforge-py/requirements-dev.txt
      # The site-build tests and the Pages demo test drive Chromium. The binary
      # is cached per Playwright version; its system libraries are not, so a
      # cache hit still installs them.
      - name: Read the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for built-site browser smoke checks
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # `output: "export"` still compiles in apps/web/.next and only writes the
      # exported site to .next-export, so the incremental cache is in .next/cache.
      - name: Restore the Next.js static export build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-export-pages-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**', '!apps/web/.next*/**', 'packages/sketchforge-engine/src/**') }}
          restore-keys: |
            next-export-pages-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-export-pages-${{ runner.os }}-
      - name: Generate documentation
        id: generate-docs
        run: npm run docs:generate
      - name: Check staged package references
        run: node scripts/docs/generate-package-references.mjs --check --output-dir .docs-site/docs/reference
      - name: Write generated docs artifact manifest
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/docs/write-generated-docs-manifest.mjs "$GITHUB_EVENT_PATH" generated-docs-artifact
      - name: Upload generated docs for the trusted commit workflow
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: actions/upload-artifact@v4
        with:
          name: docs-generated-files
          path: generated-docs-artifact/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify generated documentation
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run docs:verify
      - name: Build static documentation
        run: npm run docs:site-build
      - name: Build and stage the GitHub Pages editor demo
        env:
          STATIC_EXPORT_BASE_PATH: /${{ github.event.repository.name }}/Demo
        run: |
          npm run export
          mkdir -p docs-site-dist/Demo
          cp -R apps/web/.next-export/. docs-site-dist/Demo/
          node scripts/verify-pages-demo-artifact.mjs
          node --test tests/browser/github-pages-demo.test.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site-dist

      - name: Report fork fallback
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo 'Generated documentation is available in the `docs-generated-files` artifact.'
            echo 'Automatic PR branch updates are disabled for fork pull requests; the branch remains read-only.'
          } >> "$GITHUB_STEP_SUMMARY"

  # The editor browser suite builds the server bundle and drives six editor
  # workflows in Chromium. It needs nothing the docs build produces, so it runs
  # beside it instead of after it.
  browser:
    name: Editor browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for the editor browser tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**', '!apps/web/.next*/**', 'packages/sketchforge-engine/src/**') }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-build-${{ runner.os }}-
      - name: Verify the editor quick-start workflow in a browser
        run: npm run test:browser

  deploy:
    name: Deploy docs to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, browser]
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
