name: Release
run-name: Release ${{ inputs.version || github.ref_name }}

# Publishes the artifacts for a release: the Docker image and the two client
# libraries.
#
# Called by release-please.yml when a release is created. The tag cannot be the
# trigger: a tag pushed by a workflow using GITHUB_TOKEN does not start another
# run, because GitHub suppresses that to avoid recursion. The tag trigger below
# is kept only for a tag pushed by hand, which does start a run.
#
# `workflow_run` would also bridge that gap -- it fires on another workflow
# finishing, whoever started it. This is called instead because the caller
# already knows the version and whether a release happened, and can pass both;
# a `workflow_run` listener would have to re-derive them from an uploaded
# artifact or the API, and filter out every run that produced no release.
# Deliberately not a reusable workflow. PyPI's trusted publishing verifies the
# OIDC claim of the top-level workflow, so being called from another workflow
# makes the publish fail as an unrecognised publisher. release-please.yml
# dispatches this workflow instead.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.1.0)"
        required: true
        type: string
      publish_docker:
        description: "Publish the Docker image"
        type: boolean
        default: true
      publish_npm:
        description: "Publish @constructorfleet/sketchforge3d to npm"
        type: boolean
        default: true
      publish_engine:
        description: "Publish @sketchforge/engine to npm"
        type: boolean
        default: true
      publish_pypi:
        description: "Publish sketchforge3d"
        type: boolean
        default: true

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${TAG_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a release version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nothing is published from a tree that does not pass its own checks: a
      # bad release cannot be unpublished from npm or PyPI, only superseded.
      - name: Typecheck and test
        run: npm run ci

      - name: Build the static export
        run: npm run export

      - name: Check the manifests match the tag
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          root=$(node -p "require('./package.json').version")
          client=$(node -p "require('./packages/sketchforge-client/package.json').version")
          engine=$(node -p "require('./packages/sketchforge-engine/package.json').version")
          engine_dependency=$(node -p "require('./packages/sketchforge-client/package.json').dependencies['@sketchforge/engine']")
          python3 - <<'PY' > /tmp/py-version
          import pathlib, re
          text = pathlib.Path("packages/sketchforge-py/pyproject.toml").read_text()
          print(re.search(r'(?m)^version = "(.*)"$', text).group(1))
          PY
          py=$(cat /tmp/py-version)
          fail=0
          for pair in "root:$root" "client:$client" "engine:$engine" "python:$py" "client engine dependency:$engine_dependency"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ "$value" != "$VERSION" ]; then
              echo "::error::$name manifest is $value but the release is $VERSION"
              fail=1
            fi
          done
          # release-please commits all three in its release pull request, so a
          # disagreement here means the tag was made by hand or a manifest was
          # edited after it. Publishing a version that is not in the tree is
          # worse than stopping.
          [ "$fail" = "0" ] || exit 1
          echo "All four manifests are $VERSION"

  docker:
    name: Docker image
    needs: verify
    if: ${{ inputs.publish_docker == null || inputs.publish_docker }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release is the only thing that moves `latest`; docker.yml publishes
      # main under the `main` tag and by short SHA. A deployment can follow
      # `latest` for releases or pin a version tag.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.tag }}
            type=raw,value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sketchforge-docker
          cache-to: type=gha,mode=max,scope=sketchforge-docker

  npm:
    name: npm packages
    needs: verify
    if: ${{ (inputs.publish_npm == null || inputs.publish_npm) || (inputs.publish_engine == null || inputs.publish_engine) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance is signed with the workflow's OIDC identity.
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run engine:build && npm run client:build

      - name: Publish engine
        if: ${{ inputs.publish_engine == null || inputs.publish_engine }}
        working-directory: packages/sketchforge-engine
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish client
        if: ${{ inputs.publish_npm == null || inputs.publish_npm }}
        working-directory: packages/sketchforge-client
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: PyPI client
    needs: verify
    if: ${{ inputs.publish_pypi == null || inputs.publish_pypi }}
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there
    # is no API token to store or rotate.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        working-directory: packages/sketchforge-py
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -t tests

      - name: Build the distributions
        working-directory: packages/sketchforge-py
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the distributions install and import
        working-directory: packages/sketchforge-py
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/python -c "import sketchforge3d; print(sketchforge3d.__version__)"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sketchforge-py/dist
