name: External documentation links

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/docs/external-link-report.mjs"
      - ".github/workflows/docs-external-links.yml"
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

concurrency:
  group: docs-external-links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  report:
    name: Report external documentation link availability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check external links and write advisory report
        id: external-links
        continue-on-error: true
        run: node scripts/docs/external-link-report.mjs --report "$RUNNER_TEMP/external-link-report.json"
      - name: Upload external link report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: external-documentation-link-report
          path: |
            ${{ runner.temp }}/external-link-report.json
            ${{ runner.temp }}/external-link-report.md
          if-no-files-found: warn
          retention-days: 14
