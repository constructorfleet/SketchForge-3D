appId: com.sketchforge.desktop
productName: SketchForge
asar: true

directories:
  output: dist/desktop

# Fails the package when Resources/web has dangling links or linked server
# externals, which leave the CAD kernels unloadable and break signing (#543).
afterPack: apps/desktop/afterPack.cjs

publish:
  provider: github
  owner: constructorfleet
  repo: SketchForge-3D
  releaseType: release

files:
  - apps/desktop/main.cjs
  - apps/desktop/i18n.cjs
  - apps/desktop/port.cjs
  - apps/desktop/preload.cjs
  - apps/desktop/projectFiles.cjs
  - apps/desktop/updateNotifications.cjs
  - apps/desktop/webProcess.cjs
  - apps/desktop/windowReady.cjs
  - apps/web/src/i18n/locales/*/desktop.json
  - package.json

# Double-clicking a .skf opens it in SketchForge. mimeType must equal the
# engine's SKF_MEDIA_TYPE (packages/sketchforge-engine/src/skfProject.ts);
# tests/unit/desktopProjectFiles.test.ts fails if they drift. On Linux it
# becomes the desktop entry's MimeType; macOS and Windows register by extension.
fileAssociations:
  - ext: skf
    name: SketchForge Project
    description: SketchForge Project
    mimeType: application/vnd.sketchforge.project+zip
    role: Editor
    rank: Owner

extraResources:
  - from: apps/web/.next/standalone
    to: web
  - from: apps/web/.next/static
    to: web/apps/web/.next/static
  - from: apps/web/public
    to: web/apps/web/public

win:
  icon: apps/web/public/assets/sketchforge/sketchforge-logo.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  icon: apps/web/public/assets/sketchforge/sketchforge-logo.png
  target:
    - dmg
    - zip
  category: public.app-category.graphics-design
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  syncDesktopName: true
  icon: apps/web/public/assets/sketchforge/sketchforge-logo.png
  target:
    - AppImage
  category: Graphics
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    entry:
      GenericName: 3D Design Editor
      Keywords: 3D;CAD;Model;Modelling;STL;OBJ;STEP;3D Printing;Design;
      StartupWMClass: sketchforge
